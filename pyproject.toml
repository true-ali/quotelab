[project]
name = "quotelab"
version = "0.1.0"
description = "Event-driven market-making simulator on public Binance USD-M data"
authors = [{ name = "true-ali" }]
requires-python = ">=3.11"
dependencies = [
    "duckdb>=1.5.6",
    "matplotlib>=3.8",
    "numpy>=1.26",
    "polars>=1.0",
    "pyarrow>=15",
    "pyyaml>=6.0",
    "websockets>=17.2",
]

[project.scripts]
quotelab = "quotelab.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["quotelab"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
